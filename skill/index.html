<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yui Intro Skill</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/js/lang.js"></script>
  <style>
    :root {
      --ink: #201c17;
      --paper: #f8f1e5;
      --card: rgba(255, 251, 242, 0.86);
      --line: rgba(32, 28, 23, 0.14);
      --accent: #d86b3f;
      --muted: #786d60;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(216, 107, 63, 0.22), transparent 30rem),
        radial-gradient(circle at 82% 10%, rgba(22, 101, 89, 0.16), transparent 28rem),
        linear-gradient(135deg, #fff9ef 0%, var(--paper) 50%, #efe0cd 100%);
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .grain::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.16;
      background-image: linear-gradient(rgba(32, 28, 23, 0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(32, 28, 23, 0.08) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black, transparent 76%);
    }

    .page {
      max-width: 72rem;
      margin: 0 auto;
      padding: 1.25rem;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(16px);
      background: rgba(255, 249, 239, 0.85);
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }

    .topbar-inner {
      max-width: 72rem;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      font-family: "Noto Serif SC", serif;
      font-size: 1.35rem;
      font-style: italic;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: inherit;
      text-decoration: none;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    .nav a {
      text-decoration: none;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .nav .button {
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 999px;
      padding: 0.55rem 0.95rem;
      color: var(--ink);
    }

    .card {
      margin-top: 2.25rem;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 2rem;
      background: var(--card);
      box-shadow: 0 28px 100px rgba(50, 35, 20, 0.14);
      padding: 1.5rem;
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .eyebrow-line {
      width: 2.5rem;
      height: 1px;
      background: rgba(216, 107, 63, 0.5);
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3 {
      font-family: "Noto Serif SC", serif;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .markdown-body h1 {
      font-size: clamp(2.6rem, 8vw, 6rem);
      line-height: 0.95;
      margin: 0 0 1.5rem;
    }

    .markdown-body h2 {
      font-size: clamp(1.8rem, 4vw, 3rem);
      margin: 4rem 0 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--line);
    }

    .markdown-body h3 {
      font-size: clamp(1.28rem, 2.6vw, 1.85rem);
      margin: 2.4rem 0 0.75rem;
    }

    .markdown-body p,
    .markdown-body li {
      color: var(--muted);
      line-height: 1.85;
      font-size: 1rem;
    }

    .markdown-body p {
      margin: 0.85rem 0;
    }

    .markdown-body ul {
      list-style: none;
      padding-left: 0;
      display: grid;
      gap: 0.6rem;
      margin: 1rem 0;
    }

    .markdown-body li {
      position: relative;
      padding-left: 1.25rem;
    }

    .markdown-body li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.82em;
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 999px;
      background: var(--accent);
    }

    .markdown-body blockquote {
      margin: 1.5rem 0;
      padding: 1.1rem 1.3rem;
      border-left: 4px solid var(--accent);
      background: rgba(255, 255, 255, 0.5);
      border-radius: 0 1rem 1rem 0;
    }

    .markdown-body code {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      padding: 0.1rem 0.42rem;
      font-size: 0.9em;
    }

    .status {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 600;
    }

    @media (min-width: 768px) {
      .page {
        padding: 2rem;
      }

      .topbar-inner {
        padding: 1rem 2rem;
      }

      .card {
        padding: 2.5rem;
      }
    }
  </style>
</head>
<body class="grain">
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">Yui Skill.</a>
      <nav class="nav">
        <a href="/SKILL.md" data-i18n="rawMarkdown">Raw Markdown</a>
        <a href="/" class="button" data-i18n="portfolio">Portfolio</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="card">
      <div class="eyebrow">
        <span data-i18n="eyebrowPrimary">Agent-readable profile</span>
        <span class="eyebrow-line"></span>
        <span data-i18n="eyebrowSecondary">Markdown rendered live</span>
      </div>
      <div id="status" class="status" data-i18n="loading">Loading /SKILL.md...</div>
      <article id="content" class="markdown-body"></article>
    </section>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const contentEl = document.getElementById("content");

    function removeFrontmatter(markdown) {
      return markdown.replace(/^---[\s\S]*?---\s*/, "");
    }

    fetch("/SKILL.md", { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.text();
      })
      .then((markdown) => {
        statusEl.remove();
        marked.setOptions({ gfm: true });
        contentEl.innerHTML = marked.parse(removeFrontmatter(markdown));
      })
      .catch((error) => {
        const lang = window.YuiLang ? window.YuiLang.getCurrentLang() : "zh";
        const prefix = window.YuiLang ? window.YuiLang.getText("skill", "loadError", lang) : "Failed to load /SKILL.md:";
        statusEl.textContent = `${prefix} ${error.message}`;
      });
  </script>
</body>
</html>
