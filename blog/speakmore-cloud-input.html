    <script>
        const articleLocales = {
            zh: {
                title: '我开源了一个又快又准的云输入软件：SpeakMore 是怎么做出来的',
                date: '2026年6月4日',
                readTime: '12 分钟阅读',
                excerpt: '从 SenseVoiceSmall、FunASR、LLM 后处理、音频链路到自动粘贴，记录 SpeakMore 这个开源云输入软件的实现细节。',
                tags: ['SpeakMore', 'ASR', 'FunASR', 'Electron', 'FastAPI', 'AI Native'],
                shareTitle: '复制链接',
                copied: '复制成功',
                copyFailed: '复制失败',
                heroAlt: 'SpeakMore 云输入软件封面',
                body: `
                    <p>最近这段时间，我开发并开源了一个叫 SpeakMore 的输入软件。项目地址在这里：<a href="https://github.com/cnYui/SpeakMore" target="_blank" rel="noopener">https://github.com/cnYui/SpeakMore</a>。</p>
                    <p>它的目标很直接：让用户按下快捷键，说一句话，然后尽可能快、尽可能准地把结果输入到当前应用里。我把它称作云输入，并不是说把所有原始语音都丢到云端，而是把本地 ASR、可配置的云端 LLM 后处理、桌面输入工作流组合成一个闭环。声音在本地被识别，文本再由大模型整理成真正能输入的内容。</p>
                    <p>一开始我以为这只是一个语音转文字工具。但真正做下去以后，我发现这里面的核心不是接一个 ASR 模型那么简单，而是把语音识别、LLM 文本整理、快捷键、焦点判断、剪贴板恢复和悬浮面板全部串成一个稳定闭环。换句话说，我想做的不是一个识别 demo，而是一个每天真的可以打开用的输入工具。</p>
                    <p>所以，今天想借着 SpeakMore 这个开源项目，和大家聊聊一个又快又准的云输入软件到底是怎么做出来的：开源语音模型只是起点，真正重要的是把模型能力接进桌面场景，并且让用户敢用、能用、长期用。</p>

                    <h2 class="text-primary dark:text-dark-text">01 从“语音转文字”到“桌面工作流”</h2>
                    <p>我一开始做 SpeakMore 时，最直接的目标是让用户按下快捷键，说一段话，然后把文字自动输入到当前应用里。Windows 上是 <code>Right Alt</code>，macOS 开发态是右侧 <code>Option</code>。听起来很简单，但只要真正接入桌面环境，就会发现这不是一个单纯的模型问题。</p>
                    <p>我的理解是，SpeakMore 的核心链路其实分成三段：</p>
                    <ol class="list-decimal">
                        <li>桌面端负责感知用户意图：快捷键、焦点、选区、窗口、悬浮 UI。</li>
                        <li>本地后端负责处理语音和文本：ASR 转写、LLM 清洗、问答和翻译。</li>
                        <li>结果交付负责最后一步：能粘贴就粘贴，不能粘贴就展示悬浮面板。</li>
                    </ol>
                    <p>这也是为什么我最后选择 Electron + FastAPI 的结构。Electron 擅长处理桌面能力，FastAPI 更适合承载 Python 语音模型和大模型请求。把这两层拆开以后，边界会清楚很多：Electron 不需要硬扛 FunASR、PyTorch 这些依赖，Python 后端也不用理解托盘、剪贴板和 Accessibility。</p>
                    <blockquote><p>真正稀缺的不是“会不会接一个模型”，而是能不能把模型能力落进用户每天真实发生的场景里。</p></blockquote>

                    <h2 class="text-primary dark:text-dark-text">02 ASR：SenseVoiceSmall 是起点，不是终点</h2>
                    <p>SpeakMore 当前正式支持的 ASR 模型是 <code>FunAudioLLM/SenseVoiceSmall</code>，通过 FunASR 的 <code>AutoModel</code> 加载。这个选择很直接：它是开源模型，本地可运行，适合做一个本地优先的语音输入工具。</p>
                    <p>但落地时我没有把模型直接塞进发布包。模型文件比较大，而且用户机器、网络和缓存目录都不一样，所以 SpeakMore 采用“发布包不内置模型，初始化页触发下载”的策略。后端会按顺序查找模型：显式环境变量目录、用户设置的缓存目录、平台默认目录、Hugging Face cache，最后才下载。这样普通用户可以点按钮初始化，离线用户也可以提前准备模型目录。</p>
                    <p>设备选择上也踩过一些典型坑。CUDA、MPS、CPU 看起来只是一个参数，但真正在不同机器上跑，稳定性差异很明显。所以后端通过 <code>FUNASR_DEVICE</code> 支持 <code>cpu</code>、<code>cuda</code>、<code>cuda:0</code>、<code>mps</code> 和 <code>auto</code>，默认策略不主动启用 macOS MPS，显式选择加速设备失败时再回退 CPU，并在 <code>/model/status</code> 暴露 <code>fallback_reason</code>。</p>
                    <p>这绝不意味着加速不重要。我的判断是：<strong>对本地工具来说，默认稳定性比默认激进优化更重要。</strong> 用户第一次打开应用时，最需要的不是跑分，而是它别莫名其妙挂掉。</p>

                    <h2 class="text-primary dark:text-dark-text">03 音频链路：不要把不确定性留给后端</h2>
                    <p>做语音输入时，一个很容易被低估的问题是音频格式。浏览器可以录 WebM、Ogg，也可以给你不同采样率、不同声道数的音频。如果后端每次都要猜容器、猜声道、猜采样率，整个链路会变得非常脆。</p>
                    <p>所以 SpeakMore 在 renderer 里提前把音频整理干净。简单来说，流程就是：</p>
                    <ol class="list-decimal">
                        <li>读取用户选择的麦克风，不可用时回退默认设备。</li>
                        <li>多声道混成单声道，避免部分耳机人声落在非第 0 声道。</li>
                        <li>去掉 DC offset，对有效但偏弱的人声做受控增益。</li>
                        <li>重采样到 <code>16kHz</code>。</li>
                        <li>编码成 <code>pcm_s16le</code>，通过 WebSocket 直接发送二进制 chunk。</li>
                    </ol>
                    <p>后端收到的不是一个“可能是什么格式”的文件，而是明确声明的 <code>{ type: "pcm_s16le", sample_rate: 16000, channels: 1 }</code>。这让 ASR 输入变得可控，也让测试边界更清楚。</p>
                    <p>这里还有一个工程取舍：SpeakMore 没有把 SenseVoiceSmall 描述成原生在线 streaming 模型。现在的做法是后端创建一个语音会话，按约 <code>1200ms</code> chunk 接收 PCM，并累计完整音频多次调用 FunASR 生成阶段性结果。用户体验上可以看到逐步转写，但模型侧保持稳定简单。</p>
                    <blockquote><p>demo 可以追求“看起来实时”，真实产品必须知道自己每一个“不确定性”放在哪里。</p></blockquote>

                    <h2 class="text-primary dark:text-dark-text">04 LLM 后处理：ASR 原文不是最终答案</h2>
                    <p>语音识别只解决第一步：把声音变成原始文字。但真实输入里有口语填充词、断句错误、术语误识别、中英文空格、标点、命令意图和上下文。也就是说，ASR 原文通常不是最终可用文本。</p>
                    <p>SpeakMore 在 ASR 后面接了一层 LLM 后处理，并且根据三种模式使用不同 Prompt。</p>
                    <div class="article-card-block"><strong>听写模式</strong><p>只做无损清洗：去掉“呃、嗯、那个”这类口语噪声，修正 ASR 错词，补标点，整理技术词写法，但不回答问题、不翻译、不扩写。如果 LLM 调用失败，听写可以降级返回 ASR 原文。</p></div>
                    <div class="article-card-block"><strong>自由提问模式</strong><p>它不是“把话粘进去”，而是把语音变成一个临时助手。用户可以选中一段文本后提问，SpeakMore 会把可信选区作为 <code>selected_text</code> 发给后端，让 LLM 围绕这段内容解释、总结、改写或解题。</p></div>
                    <div class="article-card-block"><strong>翻译模式</strong><p>设置页里的目标语言会跟随本轮 <code>start_audio.parameters.output_language</code> 一起发送。用户不需要每次都说“翻译成英文”或“翻译成日语”，快捷键本身就是模式边界。</p></div>
                    <p>走完这套流程，我最大的感触是：Prompt 不是一句“请优化文本”就结束了。它本质上是在定义产品边界。什么能做，什么不能做，失败时怎么降级，都必须提前写清楚。</p>

                    <h2 class="text-primary dark:text-dark-text">05 自动粘贴：最危险的不是识别错，而是贴错地方</h2>

                    <p>Recently, I built and open-sourced an input tool called SpeakMore. The project is here: <a href="https://github.com/cnYui/SpeakMore" target="_blank" rel="noopener">https://github.com/cnYui/SpeakMore</a>.</p>
                    <p>The goal is very direct: press a shortcut, speak a sentence, and get the result into the current app as quickly and accurately as possible. I call it a cloud dictation tool, but that does not mean throwing every raw audio stream into the cloud. The real workflow is local ASR, configurable cloud LLM post-processing, and desktop delivery stitched into one loop. Speech is recognized locally, then the language model turns rough text into something actually worth inserting.</p>
                    <p>At first, I thought this was just a speech-to-text tool. But once I kept building, I realized the core was not merely connecting one ASR model. The real product is the loop around it: speech recognition, LLM cleanup, shortcuts, focus detection, clipboard restoration, and a floating panel that does not lose the result when paste is unsafe.</p>
                    <p>So this article is a field note from SpeakMore: how a fast and accurate open-source cloud dictation app is actually built. The open-source speech model is only the starting point. What really matters is bringing model capability into a desktop workflow that people can trust and use every day.</p>

                    <h2 class="text-primary dark:text-dark-text">01 From Speech-to-Text to a Desktop Workflow</h2>
                    <p>When I started SpeakMore, the most obvious goal was simple: the user presses a shortcut, speaks, and the text appears in the app they are already using. On Windows the shortcut is <code>Right Alt</code>; in the macOS development build it is the right-side <code>Option</code>. It sounds simple, but the moment you connect it to a real desktop environment, it stops being a pure model problem.</p>

                    </ol>

                    <p>The ASR model SpeakMore officially supports today is <code>FunAudioLLM/SenseVoiceSmall</code>, loaded through FunASR's <code>AutoModel</code>. The reason is straightforward: it is open source, can run locally, and fits a local-first dictation tool.</p>

                    <h2 class="text-primary dark:text-dark-text">02 ASR：SenseVoiceSmall は出発点であって、終点ではない</h2>
                    <p>SpeakMore が現在正式に対応している ASR モデルは <code>FunAudioLLM/SenseVoiceSmall</code> で、FunASR の <code>AutoModel</code> から読み込んでいます。この選択はかなり素直です。オープンソースモデルで、ローカル実行ができ、ローカル優先の音声入力ツールに向いているからです。</p>
                    <p>ただし、実装ではモデルをそのまま配布パッケージに入れていません。モデルファイルは大きく、ユーザーのマシン、ネットワーク、キャッシュディレクトリもそれぞれ違います。そこで SpeakMore は「配布パッケージにはモデルを含めず、初期化ページでユーザーがダウンロードを開始する」方式を採用しています。バックエンドは、明示された環境変数のディレクトリ、ユーザー設定のキャッシュディレクトリ、プラットフォーム既定のディレクトリ、Hugging Face cache の順にモデルを探し、最後にダウンロードを試みます。</p>
                    <p>デバイス選択でも、典型的な落とし穴を踏みました。CUDA、MPS、CPU は一見ただのパラメータに見えますが、実際にいろいろなマシンで動かすと安定性が大きく変わります。そのためバックエンドでは <code>FUNASR_DEVICE</code> によって <code>cpu</code>、<code>cuda</code>、<code>cuda:0</code>、<code>mps</code>、<code>auto</code> をサポートし、デフォルトでは macOS MPS を積極的には有効化しません。明示的にアクセラレータを選んで失敗した場合は CPU にフォールバックし、<code>/model/status</code> で <code>fallback_reason</code> を見られるようにしています。</p>
                    <p>これは高速化が重要ではないという意味ではありません。私の判断はこうです。<strong>ローカルツールにとって、デフォルトの安定性はデフォルトの攻めた最適化より重要です。</strong> ユーザーが初めてアプリを開いたときに一番必要なのはベンチマークの数字ではなく、理由も分からず落ちないことです。</p>

                    <h2 class="text-primary dark:text-dark-text">03 音声チェーン：不確実性をバックエンドに残さない</h2>
                    <p>音声入力を作るとき、意外と軽視されがちなのが音声フォーマットです。ブラウザは WebM や Ogg を録音できますし、サンプリングレートやチャンネル数も環境によって変わります。もしバックエンドが毎回コンテナ形式、チャンネル数、サンプリングレートを推測しなければならないなら、チェーン全体がかなり脆くなります。</p>
                    <p>そのため SpeakMore では、renderer 側で先に音声をきれいに整えています。簡単に言うと、流れはこうです。</p>
                    <ol class="list-decimal">
                        <li>ユーザーが選択したマイクを読み取り、使えない場合はデフォルトデバイスに戻す。</li>
                        <li>複数チャンネルをモノラルにまとめ、一部のヘッドセットで声が 0 番以外のチャンネルに入る問題を避ける。</li>
                        <li>DC offset を除去し、有効だが小さい音声には制御されたゲインをかける。</li>
                        <li><code>16kHz</code> にリサンプリングする。</li>
                        <li><code>pcm_s16le</code> にエンコードし、WebSocket でバイナリ chunk として直接送る。</li>
                    </ol>
                    <p>バックエンドが受け取るのは「たぶん何かの音声ファイル」ではなく、明確に宣言された <code>{ type: "pcm_s16le", sample_rate: 16000, channels: 1 }</code> です。これによって ASR の入力は制御しやすくなり、テスト境界もはっきりします。</p>
                    <p>ここにはもう一つの工程上の判断があります。SpeakMore は SenseVoiceSmall をネイティブなオンライン streaming モデルとして説明していません。現在の実装では、バックエンドが音声セッションを作り、およそ <code>1200ms</code> ごとの PCM chunk を受け取り、音声全体を蓄積しながら FunASR を複数回呼び出して段階的な結果を生成します。ユーザー体験としては途中の書き起こしが見えますが、モデル側は安定してシンプルなままです。</p>
                    <blockquote><p>デモは「リアルタイムっぽく見える」ことを追求できます。でも本物のプロダクトは、自分がどの不確実性をどこに置いているのかを理解していなければなりません。</p></blockquote>

                    <h2 class="text-primary dark:text-dark-text">04 LLM 後処理：ASR の原文は最終回答ではない</h2>
                    <p>音声認識が解決するのは最初の一歩だけです。音を原文テキストに変えることです。でも実際の入力には、口癖、言い直し、区切りの誤り、専門用語の誤認識、日本語と英語の間隔、句読点、命令意図、文脈があります。つまり ASR の原文は、多くの場合そのままでは最終的に使える文章ではありません。</p>
                    <p>SpeakMore では ASR の後ろに LLM 後処理を接続し、三つのモードごとに異なる Prompt を使っています。</p>
                    <div class="article-card-block"><strong>書き起こしモード</strong><p>意味を変えない整形だけを行います。「えー」「うん」「あの」などの口語ノイズを削り、ASR の誤りを直し、句読点を補い、技術用語の表記を整えます。ただし質問には答えず、翻訳せず、勝手に拡張もしません。</p></div>
                    <div class="article-card-block"><strong>自由質問モード</strong><p>これは「話した内容を貼り付ける」ものではなく、音声を一時的なアシスタントに変えるモードです。ユーザーが一段落を選択して質問すると、SpeakMore は信頼できる選択範囲を <code>selected_text</code> としてバックエンドに送り、LLM がその内容を説明、要約、書き換え、解答できます。</p></div>
                    <div class="article-card-block"><strong>翻訳モード</strong><p>設定ページにある対象言語を、その回の <code>start_audio.parameters.output_language</code> として一緒に送ります。ユーザーは毎回「英語に翻訳して」「日本語に翻訳して」と話す必要がありません。ショートカット自体がモードの境界になるからです。</p></div>
                    <p>この一連の流れを作ってみて、私が一番強く感じたのは、Prompt は「この文章を改善してください」という一文で終わるものではないということです。Prompt は本質的にはプロダクトの境界を定義します。何ができるのか、何をしてはいけないのか、失敗したときにどう降格するのかを、あらかじめ書いておく必要があります。</p>

                    <h2 class="text-primary dark:text-dark-text">05 自動貼り付け：一番危険なのは認識ミスではなく、貼り付け先を間違えること</h2>
                    <p>ASR と LLM が SpeakMore の能力の中心だとすると、自動貼り付けは信頼の中心です。ユーザーが音声入力ツールを長く常駐させられるかどうかは、それが誤操作しないと信じられるかにかなり左右されます。</p>
                    <p>私は SpeakMore に、単純な「クリップボードへ書き込む + Ctrl+V」をさせていません。Windows では、主プロセスがまず UI Automation で現在のフォーカスが信頼できるテキスト入力対象かを判断します。失敗した場合は Win32 caret を見ます。それでも不確かな場合は、WeChat、QQ、Discord、VS Code、Cursor、Slack、Notion など、明示的な許可リストに入れたアプリだけを弱い信頼の互換対象にします。macOS では Accessibility API で前面アプリ、フォーカスコントロール、選択範囲、テキスト対象を読み取ります。</p>
                    <p>対象が信頼できると確認できたときだけ、SpeakMore は一時的にクリップボードへ書き込み、貼り付けショートカットを送ります。貼り付け前にはクリップボードのスナップショットを作り、終了後は <code>finally</code> の中でユーザー本来のクリップボードを復元します。対象が使えない、フォーカスが移動した、貼り付けが失敗した場合でも、結果は消えません。フローティングパネルに表示されます。</p>
                    <p>自由質問が常にフローティングパネルへ出るのも、この理由です。書き起こしと翻訳は「入力すべきテキスト」を生成します。一方、自由質問は「ユーザーが読む答え」を生成します。この二つの配送方法を混ぜると、簡単に事故が起きます。</p>
                    <blockquote><p>音声入力ツールの底力は、どれだけ速く認識するかではなく、いつ貼り付けてはいけないかを知っていることにあります。</p></blockquote>

                    <h2 class="text-primary dark:text-dark-text">06 ローカル辞書と自動学習：だんだん自分のツールになっていく</h2>
                    <p>音声入力にはもう一つ現実的な問題があります。人それぞれ、自分だけの単語があります。プロジェクト名、ブランド名、コード用語、人名、口癖。こうしたものは汎用 ASR では一発で正しく認識しにくいです。</p>
                    <p>そこで SpeakMore にはローカル辞書を入れました。正式な辞書項目は <code>dictionary_terms</code> としてその回の音声リクエストに入り、Prompt は専門用語や短いフレーズを優先して修正します。コンテキストを辞書全体で埋め尽くさないように、バックエンドでは最大 40 件までに制限しています。</p>
                    <p>自動学習はさらに慎重です。自動貼り付けが成功した後、短時間だけ今回の入力対象を観察し、ユーザーがすぐに特定の短い語句を修正したかを見ます。候補を検出したらローカル辞書のフローに入りますが、ユーザーの代わりに大規模な書き換えを勝手に行うわけではありません。この境界はとても重要です。無差別なグローバルテキスト収集をしてはいけませんし、文全体の書き換えを辞書学習として扱うべきでもありません。</p>
                    <p>私にとって、ローカル辞書は追加機能ではなく、音声入力ツールの長期的な堀です。使えば使うほど自分に近づくことこそ、ローカルツールが一回限りのデモと違う価値だからです。</p>

                    <h2 class="text-primary dark:text-dark-text">07 SpeakMore から得た判断</h2>
                    <p>このコアチェーンを作り終えて、AI ツール開発についていくつかの判断がよりはっきりしました。</p>
                    <ol class="list-decimal">
                        <li>AI Native なツールとは、モデルをプロダクトに被せることではありません。人の注意力の配分を組み替えることです。ASR が聞き、LLM が整理し、Electron が結果をワークフローへ戻し、人間は判断し、編集し、さらに作り続ける。</li>
                        <li>本物のプロダクトにある大量の複雑さは、モデルそのものではなくモデルの周辺にあります。モデルのダウンロード、デバイスフォールバック、音声フォーマット、セッションキャンセル、遅れて届くメッセージ、クリップボード復元、フォーカス移動。これらこそが、実際に落とし込めるかどうかを決める細部です。</li>
                        <li>「自動化」を丸投げと理解してはいけません。自動化ツールであればあるほど、境界感が必要です。貼り付けられるときは貼り付ける。貼り付けられないときは表示する。降格できるときは降格する。捏造してはいけないときは明確に止まる。</li>
                        <li>ローカル優先にはまだ大きな価値があります。SpeakMore の音声原データはローカル ASR で処理され、履歴、設定、辞書、学習候補もローカルに保存されます。LLM provider はユーザーが選べますが、元のワークフローが最初から特定のクラウドサービスに縛られるべきではありません。</li>
                    </ol>

                    <h2 class="text-primary dark:text-dark-text">終わりに：毎日開きたくなるツールを作る</h2>
                    <p>私にとって SpeakMore は、単なる音声入力プロジェクトではありません。AI ツールを現実に落とし込むための実践でもあります。モデル能力は重要です。でも、その能力を安定して、信頼できて、長く使えるワークフローにすることこそ、本当のプロダクト能力です。</p>
                    <p>もしあなたも AI ツールを作っているなら、「モデルがこのタスクを完了できるか」だけを見ない方がいいと思います。むしろ、この機能は本当に自動実行すべきなのか。失敗したときにユーザーは制御権を取り戻せるのか。データの流れは明確か。このツールには一日に十数回開かれる理由があるのか。そこを問い続けるべきです。</p>
                    <p>行動力そのものが、不安に対抗する一番良い解毒剤です。AI ツール時代がどう変わるのかを眺め続けるより、自分の手で一つの本物のプロダクトを作り、細かいチェーンを一つずつ通してみる。その後で初めて、新しい開発パラダイムが何を変えたのかが、もっとはっきり見えてきます。</p>
                    <div class="article-card-block">
                        <strong>参考リンク</strong>
                        <p>SpeakMore GitHub：<a href="https://github.com/cnYui/SpeakMore" target="_blank" rel="noopener">https://github.com/cnYui/SpeakMore</a></p>
                        <p>SenseVoiceSmall モデル：<a href="https://huggingface.co/FunAudioLLM/SenseVoiceSmall" target="_blank" rel="noopener">https://huggingface.co/FunAudioLLM/SenseVoiceSmall</a></p>
                        <p>FunASR プロジェクト：<a href="https://github.com/modelscope/FunASR" target="_blank" rel="noopener">https://github.com/modelscope/FunASR</a></p>
                    </div>
                `
            }
        };

        function renderArticleLocale(lang) {
            const locale = articleLocales[lang] || articleLocales.zh;
            document.documentElement.lang = { zh: 'zh-CN', en: 'en', ja: 'ja' }[lang] || 'zh-CN';
            document.getElementById('articleTitle').textContent = locale.title;
            document.getElementById('articleMetaDate').textContent = locale.date;
            document.getElementById('articleMetaReadTime').textContent = locale.readTime;
            document.getElementById('articleExcerpt').textContent = locale.excerpt;
            document.getElementById('articleBody').innerHTML = locale.body;
            document.getElementById('articleHeroImage').alt = locale.heroAlt;
            document.getElementById('shareBtn').title = locale.shareTitle;
            document.title = `${locale.title} - Tech Blog`;
            document.querySelector('meta[name="description"]').setAttribute('content', locale.excerpt);
            document.getElementById('articleTags').innerHTML =
                `<span class="text-sm text-text-muted dark:text-dark-text-muted mr-2">${window.YuiLang ? window.YuiLang.getText('blog', 'tags', lang) : '标签:'}</span>` +
                locale.tags.map(tag => `<span class="px-3 py-1 rounded-full bg-secondary dark:bg-dark-card text-sm text-text-main dark:text-dark-text">${tag}</span>`).join('');
        }

        document.getElementById('shareBtn').addEventListener('click', async () => {
            const url = window.location.origin + window.location.pathname;
            const lang = window.YuiLang ? window.YuiLang.getCurrentLang() : 'zh';
            const locale = articleLocales[lang] || articleLocales.zh;
            try {
                await navigator.clipboard.writeText(url);
                showToast(locale.copied);
            } catch (err) {
                console.error('Failed to copy: ', err);
                showToast(locale.copyFailed);
            }
        });

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-black/80 dark:bg-white/90 text-white dark:text-black px-6 py-3 rounded-full text-sm font-medium shadow-lg transition-all duration-300 opacity-0 translate-y-2 z-50';
            toast.textContent = message;
            document.body.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('opacity-0', 'translate-y-2');
            });
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        window.addEventListener('languageChanged', (event) => {
            renderArticleLocale(event.detail.lang);
        });

        renderArticleLocale(window.YuiLang ? window.YuiLang.getCurrentLang() : 'zh');
    </script>
