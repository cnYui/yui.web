            const isEven = index % 2 === 0;
            const badgeHtml = item.badge ? `<span class="inline-block px-3 py-1 bg-accent-gold/10 dark:bg-accent-gold/20 text-accent-gold text-xs font-semibold rounded-full mb-3">${item.badge}</span>` : '';

            const images = item.images || [item.image];
            const hasMultipleImages = images.length > 1;

                                     alt="${item.title} - ${imgIndex + 1}"
                                     data-carousel="${carouselId}"
                                     data-index="${imgIndex}"/>
                            `).join('')}

            filterButtons.forEach(btn => {
                const btnFilter = btn.dataset.filter;
                if (btnFilter === activeFilter) {
                    btn.classList.remove('border', 'border-border-subtle', 'text-text-main');
                    btn.classList.add('bg-primary', 'text-white', 'border-primary');
                } else {
                    btn.classList.remove('bg-primary', 'text-white', 'border-primary');
                    btn.classList.add('border', 'border-border-subtle', 'text-text-main');
                }
            });
        }

        function filterTimeline(filter) {
            currentFilter = filter;
            currentIndex = 0;
            
            if (filter === 'All') {
                filteredData = [...projectData];
            } else {
                filteredData = projectData.filter(item => item.category === filter);
            }
            
            timeline.innerHTML = '';
            
            loadMoreContainer.innerHTML = `
                <button id="loadMoreBtn" class="group flex items-center gap-3 px-8 py-4 border-2 border-primary text-primary rounded-full hover:bg-primary hover:text-white transition-all">
                    <span class="font-medium">加载更多里程碑</span>
                    <span class="material-symbols-outlined group-hover:translate-y-1 transition-transform">expand_more</span>
                </button>
            `;
            document.getElementById('loadMoreBtn').addEventListener('click', loadMore);
            
            updateFilterButtons(filter);
            loadMore();
        }

        function loadMore() {
            const endIndex = Math.min(currentIndex + itemsPerPage, filteredData.length);
            
            for (let i = currentIndex; i < endIndex; i++) {
                const itemHtml = createTimelineItem(filteredData[i], i);
                timeline.insertAdjacentHTML('beforeend', itemHtml);
            }
            
            setTimeout(() => {
                const items = timeline.querySelectorAll('.timeline-item:not(.visible)');
                items.forEach((item, index) => {
                    setTimeout(() => {
                        item.classList.add('visible');
                    }, index * 150);
                });
            }, 50);
            
            currentIndex = endIndex;
            
            if (currentIndex >= filteredData.length) {
                loadMoreContainer.innerHTML = `
                    <div class="text-center py-8">
                        <div class="w-16 h-16 rounded-full bg-secondary flex items-center justify-center mx-auto mb-4">
                            <span class="material-symbols-outlined text-3xl text-primary">rocket_launch</span>
                        </div>
                        <p class="font-display text-xl text-primary">旅程继续...</p>
                        <p class="text-text-light text-sm mt-2">更多里程碑即将到来</p>
                    </div>
                `;
            }
        }

        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterTimeline(btn.dataset.filter);
            });
        });

        // 初始化时绑定加载更多按钮事件
        document.getElementById('loadMoreBtn').addEventListener('click', loadMore);
        loadMore();

        // 轮播图控制
        document.addEventListener('click', function(e) {
            // 处理上一张按钮
            if (e.target.closest('.carousel-prev')) {
                const btn = e.target.closest('.carousel-prev');
                const carouselId = btn.dataset.carousel;
                navigateCarousel(carouselId, -1);
            }
            
            // 处理下一张按钮
            if (e.target.closest('.carousel-next')) {
                const btn = e.target.closest('.carousel-next');
                const carouselId = btn.dataset.carousel;
                navigateCarousel(carouselId, 1);
            }
        });

        function navigateCarousel(carouselId, direction) {
            const images = document.querySelectorAll(`img[data-carousel="${carouselId}"]`);
            const dots = document.querySelectorAll(`.carousel-dot[data-carousel="${carouselId}"]`);
            
            let currentIndex = -1;
            images.forEach((img, idx) => {
                if (!img.classList.contains('hidden')) {
                    currentIndex = idx;
                }
            });
            
            if (currentIndex === -1) return;
            
            let newIndex = currentIndex + direction;
            if (newIndex < 0) newIndex = images.length - 1;
            if (newIndex >= images.length) newIndex = 0;
            
            // 隐藏当前图片
            images[currentIndex].classList.add('hidden');
            dots[currentIndex].classList.remove('bg-white');
            dots[currentIndex].classList.add('bg-white/50');
            
            // 显示新图片
            images[newIndex].classList.remove('hidden');
            dots[newIndex].classList.remove('bg-white/50');
            dots[newIndex].classList.add('bg-white');
        }
    </script>

    <!-- Particle Earth Animation -->
    <script>
        (function() {
            const canvas = document.getElementById('particleCanvas');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const section = canvas.parentElement;
            
            // 创建隐藏的地图画布
            const mapCanvas = document.createElement('canvas');
            const mapCtx = mapCanvas.getContext('2d');
            
            let width, height;
            const DOT_SPACING = 10;
            const MAX_DOT_SIZE = 4.5;
            const MIN_DOT_SIZE = 0.8;
            
            // 预渲染地图的尺寸
            const MAP_WIDTH = 1800;
            const MAP_HEIGHT = 900;
            
            let earthOffset = 0;
            const SCROLL_SPEED = 30;
            
            const BG_COLOR = '#0a0a12';
            const DOT_COLOR = { r: 120, g: 100, b: 200 };
            
            // 预渲染的地图数据
            let mapImageData = null;
            
            // 加载并预渲染 GeoJSON 到位图
            async function loadAndRenderGeoJSON() {
                try {
                    const response = await fetch('/custom.geo.json');
                    const data = await response.json();
                    
                    mapCanvas.width = MAP_WIDTH;
                    mapCanvas.height = MAP_HEIGHT;
                    
                    mapCtx.fillStyle = '#000000';
                    mapCtx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
                    
                    mapCtx.fillStyle = '#FFFFFF';
                    
                    data.features.forEach(feature => {
                        const geometry = feature.geometry;
                        if (geometry.type === 'Polygon') {
                            drawPolygon(geometry.coordinates[0]);
                        } else if (geometry.type === 'MultiPolygon') {
                            geometry.coordinates.forEach(polygon => {
                                drawPolygon(polygon[0]);
                            });
                        }
                    });
                    
                    mapImageData = mapCtx.getImageData(0, 0, MAP_WIDTH, MAP_HEIGHT);
                    
                    resize();
                    requestAnimationFrame(animate);
                } catch (error) {
                    console.error('Failed to load GeoJSON:', error);
                }
            }
            
            function drawPolygon(coords) {
                mapCtx.beginPath();
                coords.forEach((coord, i) => {
                    const x = ((coord[0] + 180) / 360) * MAP_WIDTH;
                    const y = ((90 - coord[1]) / 180) * MAP_HEIGHT;
                    if (i === 0) mapCtx.moveTo(x, y);
                    else mapCtx.lineTo(x, y);
                });
                mapCtx.closePath();
                mapCtx.fill();
            }
            
            function isLand(lon, lat) {
                if (!mapImageData) return false;
                while (lon > 180) lon -= 360;
                while (lon < -180) lon += 360;
                const x = Math.floor(((lon + 180) / 360) * MAP_WIDTH);
                const y = Math.floor(((90 - lat) / 180) * MAP_HEIGHT);
                if (x < 0 || x >= MAP_WIDTH || y < 0 || y >= MAP_HEIGHT) return false;
                const index = (y * MAP_WIDTH + x) * 4;
                return mapImageData.data[index] > 128;
            }
            
            function resize() {
                width = canvas.width = section.offsetWidth;
                height = canvas.height = section.offsetHeight;
            }
            
            function draw() {
                ctx.fillStyle = BG_COLOR;
                ctx.fillRect(0, 0, width, height);
                
                const cols = Math.ceil(width / DOT_SPACING) + 1;
                const rows = Math.ceil(height / DOT_SPACING) + 1;
                
                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        const x = col * DOT_SPACING;
                        const y = row * DOT_SPACING;
                        
                        const lon = ((x + earthOffset) / MAP_WIDTH) * 360 - 180;
                        const lat = 90 - (y / MAP_HEIGHT) * 180;
                        
                        if (isLand(lon, lat)) {
                            const size = MAX_DOT_SIZE;
                            const brightness = 0.7;
                            
                            const r = Math.floor(DOT_COLOR.r * brightness);
                            const g = Math.floor(DOT_COLOR.g * brightness);
                            const b = Math.floor(DOT_COLOR.b * brightness);
                            
                            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                            ctx.beginPath();
                            ctx.arc(x, y, size, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
            }
            
            let lastTime = 0;
            function animate(currentTime) {
                const deltaTime = Math.min((currentTime - lastTime) / 1000, 0.1);
                lastTime = currentTime;
                
                earthOffset += SCROLL_SPEED * deltaTime;
                if (earthOffset > MAP_WIDTH) earthOffset -= MAP_WIDTH;
                
                draw();
                requestAnimationFrame(animate);
            }
            
            window.addEventListener('resize', resize);
            loadAndRenderGeoJSON();
        })();
    </script>
</body>
