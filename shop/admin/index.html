<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Admin - Shop</title>
    <script>(function(){const html=document.documentElement;html.setAttribute('data-ui-ready','false');try{const theme=localStorage.getItem('yui-portfolio-theme');const lang=localStorage.getItem('yui-portfolio-lang');const langMap={zh:'zh-CN',en:'en',ja:'ja'};const resolvedTheme=theme==='dark'?'dark':'light';html.classList.toggle('dark',resolvedTheme==='dark');html.style.colorScheme=resolvedTheme;html.style.backgroundColor=resolvedTheme==='dark'?'#0f0f0f':'#ffffff';html.lang=langMap[lang]||'en';}catch(error){html.style.colorScheme='light';html.style.backgroundColor='#ffffff';html.lang='en';}})();</script>
    <style>html{background-color:#fff}html.dark{background-color:#0f0f0f}html[data-ui-ready="false"] body{opacity:0}html[data-ui-ready="true"] body{opacity:1;transition:opacity 120ms ease-out}</style>
    <link href="/styles/site.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="/js/theme.js"></script>
    <script src="/js/lang.js?v=20260419-2"></script>
    <script src="/shop/shop.js?v=20260531-0823"></script>
</head>
<body class="bg-white dark:bg-dark-bg text-text-main dark:text-dark-text font-body min-h-screen flex flex-col antialiased transition-colors duration-300">
    <header class="sticky top-0 z-50 w-full border-b border-border-subtle dark:border-dark-border bg-white/95 dark:bg-dark-bg/95 backdrop-blur-sm">
        <div class="px-6 md:px-12 py-6 flex items-center justify-between max-w-[1400px] mx-auto">
            <a class="text-2xl font-display font-semibold italic tracking-tight text-primary dark:text-dark-text hover:opacity-80 transition-opacity" href="/">Portfolio.</a>
            <a class="text-sm uppercase tracking-widest text-primary dark:text-dark-text font-medium border-b border-primary dark:border-dark-text pb-0.5" href="/shop/">Shop</a>
        </div>
    </header>
    <main class="flex-1 max-w-[1100px] mx-auto px-6 md:px-12 py-14 md:py-20 w-full">
        <section>
            <p class="text-xs uppercase tracking-[0.28em] text-text-muted dark:text-dark-text-muted">Admin</p>
            <h1 class="mt-4 font-display text-4xl md:text-6xl">生成邀请码</h1>
            <p class="mt-5 text-text-muted dark:text-dark-text-muted leading-relaxed">输入 `.env` 中配置的管理员 token，生成邀请码。用户兑换时会从未使用的 API key 库存中分配一个 key。</p>
        </section>
        <form id="adminInviteForm" class="mt-8 grid gap-4 rounded-lg border border-border-subtle dark:border-dark-border bg-white dark:bg-dark-card p-6 md:grid-cols-[1fr_8rem_auto]">
            <input id="adminTokenInput" class="h-12 rounded-md border-border-subtle dark:border-dark-border bg-white dark:bg-dark-bg text-primary dark:text-dark-text focus:border-primary focus:ring-primary" type="password" placeholder="ADMIN_TOKEN"/>
            <input id="inviteCountInput" class="h-12 rounded-md border-border-subtle dark:border-dark-border bg-white dark:bg-dark-bg text-primary dark:text-dark-text focus:border-primary focus:ring-primary" type="number" min="1" max="50" value="1"/>
            <button class="btn-primary" type="submit">生成</button>
        </form>
        <section id="adminResult" class="mt-8"></section>
        <section id="adminUsageSection" class="mt-12 border-t border-border-subtle dark:border-dark-border pt-10">
            <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
                <div>
                    <p class="text-xs uppercase tracking-[0.28em] text-text-muted dark:text-dark-text-muted">Usage</p>
                    <h2 class="mt-3 font-display text-3xl md:text-4xl">用量监控</h2>
                </div>
                <button id="usageRefreshButton" class="btn-secondary dark:bg-dark-card dark:border-dark-border dark:text-dark-text" type="button">刷新</button>
            </div>
            <div class="mt-6 grid gap-3 md:grid-cols-[1fr_10rem_10rem]">
                <input id="usageSearchInput" class="h-11 rounded-md border-border-subtle dark:border-dark-border bg-white dark:bg-dark-bg text-primary dark:text-dark-text focus:border-primary focus:ring-primary" type="search" placeholder="手机号 / preview / 状态"/>
                <select id="usageGroupFilter" class="h-11 rounded-md border-border-subtle dark:border-dark-border bg-white dark:bg-dark-bg text-primary dark:text-dark-text focus:border-primary focus:ring-primary">
                    <option value="all">全部</option>
                    <option value="shop">Shop</option>
                    <option value="unmanaged">未托管</option>
                </select>
                <select id="usageStatusFilter" class="h-11 rounded-md border-border-subtle dark:border-dark-border bg-white dark:bg-dark-bg text-primary dark:text-dark-text focus:border-primary focus:ring-primary">
                    <option value="all">全部状态</option>
                    <option value="active">使用中</option>
                    <option value="expired">已过期</option>
                    <option value="unused">未使用</option>
                    <option value="disabled">已禁用</option>
                    <option value="unmanaged">未托管</option>
                </select>
            </div>
            <div id="usageSummaryCards" class="mt-6 grid gap-3 md:grid-cols-4"></div>
            <div id="usageTable" class="mt-6 overflow-x-auto rounded-lg border border-border-subtle dark:border-dark-border"></div>
            <p id="usageMessage" class="mt-3 text-sm text-text-muted dark:text-dark-text-muted"></p>
        </section>
        <section class="mt-12 border-t border-border-subtle dark:border-dark-border pt-10">
            <div>
                <p class="text-xs uppercase tracking-[0.28em] text-text-muted dark:text-dark-text-muted">Import</p>
                <h2 class="mt-3 font-display text-3xl md:text-4xl">日志导入</h2>
            </div>
            <form id="usageImportForm" class="mt-6 grid gap-3 rounded-lg border border-border-subtle dark:border-dark-border bg-white dark:bg-dark-card p-5 md:grid-cols-[12rem_auto]">
                <input id="usageImportMonth" class="h-11 rounded-md border-border-subtle dark:border-dark-border bg-white dark:bg-dark-bg text-primary dark:text-dark-text focus:border-primary focus:ring-primary" type="month"/>
                <button class="btn-primary" type="submit">导入</button>
            </form>
            <p id="usageImportMessage" class="mt-3 text-sm text-text-muted dark:text-dark-text-muted"></p>
        </section>
    </main>
    <script>window.YuiShop.initAdminPage();</script>
</body>
</html>
