<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Redeem - Shop</title>
    <script>(function(){const html=document.documentElement;html.setAttribute('data-ui-ready','false');try{const theme=localStorage.getItem('yui-portfolio-theme');const lang=localStorage.getItem('yui-portfolio-lang');const langMap={zh:'zh-CN',en:'en',ja:'ja'};const resolvedTheme=theme==='dark'?'dark':'light';html.classList.toggle('dark',resolvedTheme==='dark');html.style.colorScheme=resolvedTheme;html.style.backgroundColor=resolvedTheme==='dark'?'#0f0f0f':'#ffffff';html.lang=langMap[lang]||'en';}catch(error){html.style.colorScheme='light';html.style.backgroundColor='#ffffff';html.lang='en';}})();</script>
    <style>html{background-color:#fff}html.dark{background-color:#0f0f0f}html[data-ui-ready="false"] body{opacity:0}html[data-ui-ready="true"] body{opacity:1;transition:opacity 120ms ease-out}</style>
    <link href="/styles/site.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="/js/theme.js"></script>
    <script src="/js/lang.js?v=20260419-2"></script>
    <script src="/shop/shop.js?v=20260531-0823"></script>
</head>
<body class="bg-white dark:bg-dark-bg text-text-main dark:text-dark-text font-body min-h-screen flex flex-col antialiased transition-colors duration-300">
    <header class="sticky top-0 z-50 w-full border-b border-border-subtle dark:border-dark-border bg-white/95 dark:bg-dark-bg/95 backdrop-blur-sm">
        <div class="px-6 md:px-12 py-6 flex items-center justify-between max-w-[1400px] mx-auto">
            <a class="text-2xl font-display font-semibold italic tracking-tight text-primary dark:text-dark-text hover:opacity-80 transition-opacity" href="/">Portfolio.</a>
            <a class="text-sm uppercase tracking-widest text-primary dark:text-dark-text font-medium border-b border-primary dark:border-dark-text pb-0.5" href="/shop/">Shop</a>
        </div>
    </header>
    <main class="flex-1 max-w-[980px] mx-auto px-6 md:px-12 py-14 md:py-20 w-full">
        <div class="grid lg:grid-cols-[0.9fr_1.1fr] gap-10 lg:gap-16">
            <section>
                <p class="text-xs uppercase tracking-[0.28em] text-text-muted dark:text-dark-text-muted">Redeem</p>
                <h1 class="mt-4 font-display text-4xl md:text-6xl">兑换 Codex 月额度</h1>
                <p class="mt-5 text-text-muted dark:text-dark-text-muted leading-relaxed">私下付款后，你会收到一个邀请码。输入手机号和邀请码后，系统会生成 API key，并从兑换成功那一刻开始计时 31 天。</p>
                <div class="mt-8 rounded-lg border border-border-subtle dark:border-dark-border bg-background-soft dark:bg-dark-surface p-5">
                    <p class="text-sm text-text-muted dark:text-dark-text-muted">手机号是唯一查询方式，请填写后续会继续使用的手机号。</p>
                </div>
            </section>
            <section class="border border-border-subtle dark:border-dark-border rounded-lg p-6 md:p-8 bg-white dark:bg-dark-card shadow-soft dark:shadow-soft-dark">
                <div class="flex items-start justify-between gap-6 border-b border-border-subtle dark:border-dark-border pb-6">
                    <div>
                        <p class="text-xs uppercase tracking-[0.2em] text-text-muted dark:text-dark-text-muted">Product</p>
                        <h2 class="mt-2 text-2xl font-display">Codex 每月额度</h2>
                    </div>
                    <p class="text-2xl font-semibold">¥30.00</p>
                </div>
                <form id="redeemForm" class="mt-7 space-y-5">
                    <label class="block">
                        <span class="text-sm font-medium text-primary dark:text-dark-text">手机号</span>
                        <input id="phoneInput" class="mt-2 w-full h-12 rounded-md border-border-subtle dark:border-dark-border bg-white dark:bg-dark-bg text-primary dark:text-dark-text focus:border-primary focus:ring-primary" type="tel" inputmode="numeric" autocomplete="tel" minlength="11" maxlength="11" pattern="^1[3-9]\d{9}$" required placeholder="请输入 11 位手机号"/>
                    </label>
                    <label class="block">
                        <span class="text-sm font-medium text-primary dark:text-dark-text">邀请码</span>
                        <input id="inviteCodeInput" class="mt-2 w-full h-12 rounded-md border-border-subtle dark:border-dark-border bg-white dark:bg-dark-bg text-primary dark:text-dark-text focus:border-primary focus:ring-primary uppercase" autocomplete="one-time-code" placeholder="例如 YUI-ABC123-DEF456"/>
                    </label>
                    <p id="redeemMessage" class="min-h-5 text-sm text-red-600"></p>
                    <button class="btn-primary w-full" type="submit">兑换 API key</button>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
