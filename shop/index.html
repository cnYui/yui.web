<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Shop - Yui's Portfolio</title>
    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #050505;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
        }

        .shop-entry-page {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            background: #050505;
        }

        .shop-entry-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            user-select: none;
            pointer-events: none;
        }

        .shop-entry-hotspot {
            position: absolute;
            top: 51%;
            left: 50%;
            display: block;
            width: clamp(190px, 21vw, 560px);
            height: clamp(160px, 17vw, 430px);
            transform: translate(-50%, -50%);
            border-radius: 999px;
            color: transparent;
            cursor: pointer;
            font-size: 0;
            outline-offset: 8px;
            -webkit-tap-highlight-color: transparent;
        }

        .shop-entry-hotspot:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.86);
        }
    </style>
</head>
<body>
    <main class="shop-entry-page" aria-label="Shop">
        <img class="shop-entry-image" src="/images/optimized/shop/code-transit-entry.webp" alt="" width="1800" height="1005" decoding="async"/>
        <a class="shop-entry-hotspot" href="/home" data-sub2api-link aria-label="进入 Sub2API"></a>
    </main>
</body>
</html>
