<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>重置密码</title>
    <script>(function(){const html=document.documentElement;html.setAttribute('data-ui-ready','false');try{const theme=localStorage.getItem('yui-portfolio-theme');const lang=localStorage.getItem('yui-portfolio-lang');const langMap={zh:'zh-CN',en:'en',ja:'ja'};const resolvedTheme=theme==='dark'?'dark':'light';html.classList.toggle('dark',resolvedTheme==='dark');html.style.colorScheme=resolvedTheme;html.style.backgroundColor=resolvedTheme==='dark'?'#0f0f0f':'#ffffff';html.lang=langMap[lang]||'en';}catch(error){html.style.colorScheme='light';html.style.backgroundColor='#ffffff';html.lang='en';}})();</script>
    <style>html{background-color:#fff}html.dark{background-color:#0f0f0f}html[data-ui-ready="false"] body{opacity:0}html[data-ui-ready="true"] body{opacity:1;transition:opacity 120ms ease-out}</style>
    <link href="/styles/site.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="/js/theme.js"></script>
    <script src="/js/lang.js?v=20260419-2"></script>
    <script src="/shop/shop.js?v=20260609-account"></script>
</head>
<body class="bg-white dark:bg-dark-bg text-text-main dark:text-dark-text font-body min-h-screen flex flex-col antialiased transition-colors duration-300">
    <header class="sticky top-0 z-50 w-full border-b border-border-subtle dark:border-dark-border bg-white/95 dark:bg-dark-bg/95 backdrop-blur-sm">
        <div class="px-6 md:px-12 py-6 flex items-center justify-between max-w-[1400px] mx-auto">
            <a class="text-2xl font-display font-semibold italic tracking-tight text-primary dark:text-dark-text hover:opacity-80 transition-opacity" href="/">Portfolio.</a>
            <a class="text-sm uppercase tracking-widest text-primary dark:text-dark-text font-medium border-b border-primary dark:border-dark-text pb-0.5" href="/shop/">Shop</a>
        </div>
    </header>
    <main class="shop-auth-main flex-1 w-full max-w-[1400px] mx-auto px-6 md:px-12 flex items-stretch">
        <img class="shop-auth-background-figure" src="/shop/assets/login/yui-login-bg.png" alt="" aria-hidden="true"/>
        <div class="shop-auth-content py-12 md:py-16">
            <section class="shop-auth-panel border border-border-subtle dark:border-dark-border rounded-lg p-8 md:p-10 shadow-soft dark:shadow-soft-dark">
                <form id="passwordResetForm" class="space-y-4">
                    <label class="block">
                        <span class="text-sm font-medium text-primary dark:text-dark-text">手机号</span>
                        <input id="resetPhone" class="mt-2 w-full h-11 rounded-md border-border-subtle dark:border-dark-border bg-white dark:bg-dark-bg text-primary dark:text-dark-text focus:border-primary focus:ring-primary" type="tel" inputmode="numeric" autocomplete="tel" minlength="11" maxlength="11" pattern="^1[3-9]\d{9}$" required placeholder="请输入 11 位手机号"/>
                    </label>
                    <label class="block">
                        <span class="text-sm font-medium text-primary dark:text-dark-text">重置码</span>
                        <input id="resetPasswordCode" class="mt-2 w-full h-11 rounded-md border-border-subtle dark:border-dark-border bg-white dark:bg-dark-bg text-primary dark:text-dark-text focus:border-primary focus:ring-primary" type="text" autocomplete="one-time-code" required placeholder="RST-XXXXXX-XXXXXX"/>
                    </label>
                    <label class="block">
                        <span class="text-sm font-medium text-primary dark:text-dark-text">新密码</span>
                        <input id="resetNewPassword" class="mt-2 w-full h-11 rounded-md border-border-subtle dark:border-dark-border bg-white dark:bg-dark-bg text-primary dark:text-dark-text focus:border-primary focus:ring-primary" type="password" autocomplete="new-password" required placeholder="至少 8 位，含大小写字母和数字"/>
                    </label>
                    <label class="block">
                        <span class="text-sm font-medium text-primary dark:text-dark-text">再次输入新密码</span>
                        <input id="resetConfirmPassword" class="mt-2 w-full h-11 rounded-md border-border-subtle dark:border-dark-border bg-white dark:bg-dark-bg text-primary dark:text-dark-text focus:border-primary focus:ring-primary" type="password" autocomplete="new-password" required placeholder="请再次输入新密码"/>
                    </label>
                    <p id="passwordResetMessage" class="min-h-5 text-sm text-red-600"></p>
                    <button class="btn-primary w-full" type="submit">重置并登录</button>
                    <p class="text-sm text-text-muted dark:text-dark-text-muted">想起密码了？<a class="text-primary dark:text-dark-text underline underline-offset-4" href="/shop/login/">登录</a></p>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
